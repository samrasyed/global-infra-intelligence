version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app
    environment:
      - DATABASE_URL=sqlite:///./gciip.db
      - ENABLE_SCHEDULER=true
      - CORS_ORIGINS=http://localhost:3000
      # Optional - set to upgrade summarization/chat quality:
      # - GEMINI_API_KEY=
      # - OLLAMA_HOST=http://ollama:11434

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_data:
